<!DOCTYPE html>
<html>
  <head>
    <!-- Material Design fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Material Design -->
    <link href="https://cdn.jsdelivr.net/gh/mdbootstrap/bootstrap-material-design@0.5.10/dist/css/bootstrap-material-design.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/mdbootstrap/bootstrap-material-design@0.5.10/dist/css/ripples.min.css" rel="stylesheet">

    <link href="jquery.dropdown.css" rel="stylesheet">
  </head>
  <body>

    <button>Click</button>
<br>
<br>
<br>
<br>


    <br><br><br>
     <select class="select form-control floating-label" placeholder="Select a service type" data-filter="true">
      <option></option>
      <option>Air Conditioning &amp; Heating</option>
      <option>Alignment inspection</option>
      <option>Brake System</option>
      <option>Cooling System</option>
      <option>Engine Service</option>
      <option>Fluid Service</option>
      <option>Fuel System</option>
      <option>Maintenance Services</option>
      <option>Mercedes Services</option>
      <option>Steering &amp; Suspension</option>
      <option>Tires</option>
      <option>Transmission services</option>
      <option>Tune - up</option>
    </select>

    <br><br><br>

    <select id="multi" multiple>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
    </select>




    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mdbootstrap/bootstrap-material-design@0.5.10/dist/js/material.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mdbootstrap/bootstrap-material-design@0.5.10/dist/js/ripples.min.js"></script>

    <script src="jquery.dropdown.js"></script>
    <script>
      $.material.init();

      $(document).ready(function() {
        $("select").dropdown({
          "optionClass": "withripple",
          "autoinit": "select"
        });
      });

      $("button").click(function() {
        $("body").append("<select class=select><option>hey</option><option>hey</option></select>");
      });

    </script>


    <style>
      body {
        width: 200px;
        margin: 100px;
      }
    </style>

  </body>
</html>
